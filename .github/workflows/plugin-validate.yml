name: plugin-validate

# MS4 step 4.7 — manifest validation on every PR and every push to main.
#
# Strict mode fails on warnings (misspelled or unrecognized manifest fields),
# which is what a directory-published plugin needs: a silently-ignored typo in
# plugin.json is how a plugin loads with zero skills.
#
# Scope note. Only voicenter-bot-builder is gated strictly. As of v1.19.0 the
# marketplace root and the voicenter-mcp / voicenter-api manifests do not carry
# `author`, so --strict fails on them for a reason that predates this release and
# belongs to those plugins' own versioning. They are validated non-strict here so
# real regressions still fail the build, and the gap is tracked in
# plugins/voicenter-bot-builder/docs/planning/license-decision.md §3 rather than
# being fixed by a drive-by edit to three other plugins.
#
# MS6 adds the eval harness (golden-file byte-compare + trigger evals) as a
# separate job in this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate voicenter-bot-builder (strict — release gate)
        run: claude plugin validate ./plugins/voicenter-bot-builder --strict

      - name: Validate marketplace root and sibling plugins (non-strict)
        run: |
          claude plugin validate .
          for p in voicenter-mcp voicenter-api voicenter-dashboard; do
            if [ -d "./plugins/$p" ]; then
              echo "::group::$p"
              claude plugin validate "./plugins/$p"
              echo "::endgroup::"
            fi
          done

      - name: Report which manifests still fail strict
        if: always()
        run: |
          echo "Manifests not yet strict-clean (informational, does not fail the build):"
          claude plugin validate . --strict 2>&1 | sed 's/^/  /' || true
          for p in voicenter-mcp voicenter-api voicenter-dashboard; do
            if [ -d "./plugins/$p" ]; then
              claude plugin validate "./plugins/$p" --strict 2>&1 | sed "s/^/  [$p] /" || true
            fi
          done

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: V-S static suite
        working-directory: plugins/voicenter-bot-builder/examples
        run: python check-static.py --plugin ..

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Two goldens, two different claims:
      #   expected-output.json        (frozen, v1.17.0 wire baseline)
      #     -> proves the progressive-disclosure restructure changed ZERO bytes.
      #        Never regenerate. --wire-baseline 1.17.0 omits PersonaID, which
      #        postdates it.
      #   expected-output-1.19.0.json (shipping)
      #     -> proves current emission is correct, including the PersonaID field
      #        added by the functional v1.18.0 (contract R7).
      # The delta between them must stay exactly one key. That assertion is the
      # point: it bounds what upstream's functional release changed.
      - name: F1 reproduces the frozen v1.17.0 golden byte-for-byte
        working-directory: plugins/voicenter-bot-builder/examples
        run: |
          python assemble.py sample-spec-detailed.md --wire-baseline 1.17.0 -o /tmp/f1-frozen.json
          diff /tmp/f1-frozen.json expected-output.json

      - name: F1 reproduces the shipping golden byte-for-byte
        working-directory: plugins/voicenter-bot-builder/examples
        run: |
          python assemble.py sample-spec-detailed.md -o /tmp/f1.json
          diff /tmp/f1.json expected-output-1.19.0.json

      - name: The two goldens differ by exactly PersonaID
        working-directory: plugins/voicenter-bot-builder/examples
        run: |
          diff expected-output.json expected-output-1.19.0.json > /tmp/delta.txt || true
          cat /tmp/delta.txt
          test "$(grep -c '^>' /tmp/delta.txt)" -eq 2      # BotVersionStatusId re-emitted with comma, + PersonaID
          grep -q '^> *"PersonaID": 3' /tmp/delta.txt

      - name: F1 passes the cross-reference checks on both baselines
        working-directory: plugins/voicenter-bot-builder/examples
        run: |
          python verify.py sample-spec-detailed.md expected-output.json --wire-baseline=1.17.0
          python verify.py sample-spec-detailed.md expected-output-1.19.0.json

      - name: CHK-25 actually fires (a check that cannot fail proves nothing)
        working-directory: plugins/voicenter-bot-builder/examples
        run: |
          python - <<'PY'
          import io, json
          d = json.load(io.open('expected-output-1.19.0.json', encoding='utf-8'))
          del d['ActiveVersionInfo']['PersonaID']
          io.open('/tmp/chk25-absent.json', 'w', encoding='utf-8', newline='\n').write(
              json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY
          python verify.py sample-spec-detailed.md /tmp/chk25-absent.json > /tmp/c25.txt
          cat /tmp/c25.txt
          grep -q 'Check 25 \[advisory\]' /tmp/c25.txt

      # Finding N1: Skill 1's canonical opening-behaviour template tripped CHK-19 and
      # blocked assembly. Fixed by paraphrasing the template AND excluding
      # fully-parenthesised lines from FP-4 quote extraction. Case 3 is the guard —
      # it asserts a genuine duplicate still fails, i.e. that narrowing a BLOCKING
      # check did not blind it.
      - name: CHK-19 regression (N1 fixed, sensitivity retained)
        working-directory: plugins/voicenter-bot-builder/examples
        run: python test-chk19-regression.py

      - name: F2 fires exactly the three seeded violations
        working-directory: plugins/voicenter-bot-builder/examples
        run: |
          python assemble.py sample-spec-seeded.md -o /tmp/f2.json
          # exits 1 by design (two blocking failures) — assert the exact check set
          python verify.py sample-spec-seeded.md /tmp/f2.json > /tmp/report.txt || true
          cat /tmp/report.txt
          grep -q 'Check 3 \[BLOCKING\]'  /tmp/report.txt
          grep -q 'Check 7 \[BLOCKING\]'  /tmp/report.txt
          grep -q 'Check 22 \[advisory\]' /tmp/report.txt
          test "$(grep -c '^Check ' /tmp/report.txt)" -eq 3
